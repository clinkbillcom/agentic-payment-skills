interface:
  display_name: "Visa Skill"
  short_description: "Payments, ordering, checkout, shopping, coupons, vouchers, benefits, and Visa commerce."
  default_prompt: >-
    Use the bundled visa-cli only. The resolved Skill Path and launcher are
    authoritative. Execute it directly: never run ls, stat, find, which, test -x,
    cat, grep, list bin, read wrapper/package/config, or inspect environment.
    The launcher already pins the distribution search environment, so anonymous
    discovery omits --sandbox/--test and performs no environment or wallet
    preflight. Check wallet environment only after an exact product selection
    and explicit purchase authorization, immediately before authenticated
    purchase preparation.
    Visa recommend/detail/taxonomy never take --sandbox or --test. Before Visa
    discovery, resolve and remember HK/CN in the recommend call. A unique
    --region hk or --region cn automatically selects that endpoint and persists
    it as the next default. With no HK/CN region, omit --market so recommend
    uses saved config and defaults missing config to hk. When source and
    destination are explicitly different, pass both --market <source> and
    --region <destination>; explicit market wins. Never run visa region get/set
    as a search preflight. Other or multi-value destinations do not update the
    saved source.
    Route every product, category, or merchant discovery and every explicit
    buy/order/checkout request through exactly one visa recommend-products,
    even without a Visa, Benefit, coupon, voucher, discount, or offer signal.
    我想下单咖啡, 有咖啡的券吗, Visa 咖啡优惠券, and 有哪些咖啡权益 all use
    this aggregate. Never call catalog search for initial shopping discovery in
    this branch. Read only references/visa-recommend-filters.md and choose the
    smallest safe filter shape. Use one strict explicit-filter call by default. Use
    --filter-sets only when exactly four genuinely different safe plans improve
    recall. Preserve every explicit brand, merchant, product, category,
    geography, eligibility, reward type, and other hard constraint. Set
    reward_type only when the user explicitly names the reward type;
    generic 优惠, benefit, offer, or 礼遇 omits it. Never fan out reward types
    or duplicate filters to reach a count. Run exactly one visa
    recommend-products with --anonymous, the locked language, and the locked
    sandbox/test flag. It recommends Visa Programs and concurrently checks each
    one against configured exact internal UCP routes; never issue separate
    recommend, detail, product-search, merchant-list, or external-page calls.
    Read only products and visaBenefits. After independent hard-constraint
    filtering, always present nonempty exact orderable products first, then
    relevant visaBenefits. If only products remain, show products only and do
    not mention missing Benefits, Offers, coupons, or discounts. If only
    visaBenefits remain, show Benefits only and do not mention missing or
    unorderable products. Only when both filtered collections are empty, give
    one concise no-results answer. A Program represented by a product must not
    also be displayed as a Benefit.
    matchedPrograms is purchase provenance only: never reconstruct a Benefit
    title, activity description, Offer URL, eligibility, terms, or CTA from it.
    visaBenefits is the only source of user-facing Benefit rows. If
    returnedProductCount>0 and returnedVisaBenefitCount=0, present products only.
    Independently filter unmatched visaBenefits by the original hard
    constraints. PRODUCT_SELECTION_REQUIRED, unavailable, external, and failed
    matches remain Benefits. Disclose partial productMatching coverage. If
    recommendationMode is fallback_all_offers, no_matching_offers, or no row
    survives semantic filtering, suppress fallback rows and apply the same
    result-presentation rules; do not run broad catalog search in this branch.
    Treat only structured ok=false,
    error.type=api_error, whose message starts exactly Visa recommendation
    relaxed explicitly requested filters: as the same no-strict-match result;
    every other error stops. Catalog price.amount and price_range amounts are minor
    units: convert with ISO currency fraction digits before display or freeze.
    Thus amount=100 USD is USD 1.00. Keep a title denomination such as HKD 100
    separate from the USD purchase price. Invite ordering for products returned
    by the aggregate, but wait for an explicit purchase reply before
    commerce-login. When the user selects an unmatched Visa Benefit and asks
    for details, run visa detail by stable Program code; do not rerun
    product-search and do not add a purchase CTA. For Visa Program
    purchases, use a valid Program merchantCategoryCode first. If it is absent,
    classify MCC only from the complete frozen merchant/product context with
    high confidence. The exact vsrp.hk/p/o5s plus mcht_ftmse61a6az0 Wellcome
    supermarket gift-card route uses MCC 5411. Invalid/conflicting Program MCC,
    low confidence, or title-only guessing stops before login. Freeze the
    resolved MCC and reuse it unchanged. Direct shopping products use
    commerce-login then commerce-run mode=catalog_purchase. For Eats365,
    manual_item_facts is a normal result:
    freeze channel, store, product, title, price, currency, availability, and
    URL from one broad-Catalog snapshot. Coffee and quick-service food use
    high-confidence MCC 5814, NO_SHIPPING_REQUIRED, and
    digitalDeliveryExpected=false. Ask when MCC or fulfillment confidence is
    low. Never send program.code in purchase or catalog_purchase contexts. If
    no eligible VIC-ready Visa card exists, commerce-login creates or reuses
    one exact no-card PENDING Instruction. It may return a Bind Card link for
    the user, but never opens it automatically and never ends after showing it.
    Keep the same CLI process in the foreground while the user clicks that link
    or binds in an existing Agent Portal. Continue only after the same card has
    visaRegistrationSucceeded=true and CWallet activates that exact
    Instruction. Timeout permits only the exact read-only continuation, never
    a new Instruction or payment retry. Keep all deterministic payment steps
    inside the CLI, never rerun commerce-run after possible Checkout creation,
    and do not read references or use runtime --help during ordinary execution.
