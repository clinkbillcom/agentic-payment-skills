interface:
  display_name: "Visa Skill"
  short_description: "Visa Benefits, Fuhui coupon matching, and fast aggregate Catalog shopping."
  default_prompt: >-
    Use the bundled visa-cli only. Lock one user language and one environment.
    Visa recommend/detail/taxonomy never take --sandbox or --test. Treat Hong
    Kong as --region hk unless the user explicitly says the card is HK-issued.
    For broad, category, or merchant-specific Visa Benefit shopping, run one
    recommend, locate Fuhui from the public internal merchant list, page its
    Catalog with the current user query. Every relevant Fuhui item always has
    productType FUHUI_VISA_PRODUCT; PROGRAM_FUHUI_MATCH is only an optional
    independently proven relation label. All Fuhui and direct Catalog shopping
    use commerce-login then commerce-run mode=catalog_purchase. Separate voucher
    face value from structured purchase price/currency. For Eats365,
    manual_item_facts is a normal result: freeze channel, store, original query,
    Catalog environment/language, product, title, price, currency, availability,
    and URL from one broad-Catalog snapshot. Classify MCC and fulfillment from
    the exact context; coffee and quick-service food use high-confidence MCC
    5814, NO_SHIPPING_REQUIRED, and digitalDeliveryExpected=false. Fuhui digital
    coupons use digitalDeliveryExpected=true. Ask when classification confidence
    is low. Never send program.code in purchase or catalog_purchase contexts.
    Keep Quick Instruction and all deterministic payment steps inside the CLI,
    never rerun commerce-run after possible Checkout creation, and do not read
    references or use runtime --help during ordinary execution.
