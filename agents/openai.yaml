interface:
  display_name: "Visa Skill"
  short_description: "Payments, ordering, checkout, shopping, coupons, vouchers, benefits, and Visa commerce."
  default_prompt: >-
    Use the bundled visa-cli only. The resolved Skill Path and launcher are
    authoritative. Execute it directly: never run ls, stat, find, which, test -x,
    cat, grep, list bin, read wrapper/package/config, or inspect environment.
    The launcher already pins the distribution search environment, so anonymous
    discovery omits --sandbox/--test and performs no environment or wallet
    preflight. Check wallet environment only after an exact product selection
    and explicit purchase authorization, immediately before authenticated
    purchase preparation.
    Visa recommend/detail/taxonomy never take --sandbox or --test. Omit --market
    in every search: recommend uses saved config and defaults missing config to
    hk, and a search never switches the HK/CN source. A taxonomy --region is a
    destination, never a source, so --region hk, --region cn, and --region jp
    all leave the saved market unchanged. Run visa region set <hk|cn> only when
    the user explicitly asks to switch markets and visa region get only when the
    user asks which market is active; neither is a search preflight, and asking
    for offers in a place is not asking to switch markets. Pass --market only
    when the user explicitly names the card-issuing market for that one call;
    it overrides that call only and persists nothing.
    Route every initial product, category, merchant, buy/order/checkout, and Benefit
    request through exactly one visa recommend-products. This product-match
    branch never runs broad Catalog: never pass --include-broad-catalog or
    --broad-queries and never call standalone catalog search as fallback. Read only
    references/visa-recommend-filters.md and choose the smallest safe filter
    shape. Every plan must include region; use the user's region, else the
    remembered search region, else hk. Include at least one category whenever
    the request names a category, merchant, brand, or product, and omit category
    only for a generic regional ask such as 日本有什么优惠 or any offers, which
    returns that region's first page. Never guess a category. When no offer
    satisfies every requested filter the CLI fails with
    reason=no_offer_for_filter_combination in error.details, meaning the axes
    are too narrow together: rerun once with the retryFilters from those details
    and answer from that result, never from the failed call alone. In
    --filter-sets mode an unmatchable set degrades to no-match and is reported
    in strictMatchFailures while the other sets still return. Category
    accepts multiple values as OR; prefer specific child codes and one
    multi-category plan. Add purpose, attribute, card_level, or card_issuer only
    when explicitly stated by the current user; otherwise omit them. Never
    choose limit or page. Use one strict explicit-filter call by default. Use
    --filter-sets only when exactly four genuinely different safe plans improve
    recall. Preserve every explicit brand, merchant, product, category,
    geography, eligibility, reward type, and other hard constraint. Never infer
    or pass --type for recommend-products; Benefit, reward, coupon, discount,
    and purchase wording does not select it. Never fill reward_type in filter
    objects or pass --reward-type, even for coupon or discount requests.
    Keep region, category, and explicitly requested purpose such as local.
    Never duplicate filters to reach a count. Run exactly one visa
    recommend-products with the unchanged original current user query.
    That positional query is the only primary search text. Never pass --keyword
    or put keyword inside --filter-sets. Visa recommendation sends taxonomy
    filters only and no keyword. Only after exact Program-to-merchant matching,
    the CLI uses the unchanged query as that merchant's Catalog query. Offer
    titles are display and provenance only and never replace it. Also pass
    --anonymous and the locked language, but no sandbox/test environment flag.
    It anonymously loads the selected environment merchant list once and routes
    a Program only when its exact code equals merchant ext.visa_program_id.
    Offer URLs never select a merchant.
    Never issue separate recommend, detail, product-search, merchant-list, or
    external-page calls.
    Read only products and visaBenefits. Before display, lightly check every
    row against the original request using product title/sourceTitle/merchant
    and Benefit title/summary/tags. Remove clearly unrelated rows: a coffee
    request excludes supermarket gift cards and supermarket Benefits. Keep
    plausible translations, brand aliases, and category synonyms; do not invent
    new constraints. Present nonempty products first, then visaBenefits. If only
    products remain, show products only and do
    not mention missing Benefits, Offers, coupons, or discounts. If only
    visaBenefits remain, show Benefits only and do not mention missing or
    unorderable products. Only when both filtered collections are empty, give
    one concise no-results answer. Products contains only verified internal UCP
    products from exact Program-to-merchant matching. A Program represented by
    a product must not also be displayed as a Benefit.
    matchedPrograms is purchase provenance only: never reconstruct a Benefit
    title, activity description, Offer URL, eligibility, terms, or CTA from it.
    visaBenefits is the only source of user-facing Benefit rows. If
    returnedProductCount>0 and returnedVisaBenefitCount=0, present products only.
    Independently filter unmatched visaBenefits by the original hard
    constraints. PRODUCT_SELECTION_REQUIRED, unavailable, external, and failed
    matches remain Benefits. Disclose partial productMatching coverage. If
    recommendationMode is fallback_all_offers, no_matching_offers, or no row
    survives semantic filtering, suppress fallback Visa rows and apply the same
    result-presentation rules. Never announce a Visa miss while products
    remain. Disclose partial productMatching coverage. A Visa miss, relaxed
    explicit filter, or command error never starts Catalog fallback. Catalog
    price.amount and price_range amounts are minor
    units: convert with ISO currency fraction digits before display or freeze.
    Thus amount=100 USD is USD 1.00. Keep a title denomination such as HKD 100
    separate from the USD purchase price. When the user selects an unmatched Visa Benefit and asks
    for details, run visa detail by stable Program code; do not rerun
    product-search and do not add a purchase CTA. Once the user selects an
    exact returned product and explicitly authorizes buy, order, or checkout,
    preserve the latest unchanged recommend-products snapshot and proceed
    directly to commerce-login; never run or refresh visa detail in the
    purchase path. If that snapshot is missing or invalidated, stop and return
    to discovery. With one unique product and unchanged displayed order facts,
    买这个, 帮我下单, 确认购买, buy this, and confirm purchase are valid authorization.
    Never require a full-order restatement or a confirmation template; ask only
    for genuinely missing or materially changed facts. Do not search or ask to
    order again for an already authorized selection.
    Only one product with quantity 1 is supported; never split orders or silently
    reduce a multi-item request. Save the selected row's purchaseContext unchanged
    and use the same file in commerce-login and commerce-run. Never build an
    Instruction context, infer MCC, or copy Program fields. If purchaseContext is
    missing, report purchaseContextUnavailable instead of inventing data.
    Once the user requests the unchanged purchase, run login and then commerce-run
    without another conversation checkpoint. Do not ask the user to authorize in
    chat, say done, or confirm continuation; they act on the CLI-opened browser page.
    Before login, say once in the locked language:
    "现在启动登录流程，可能打开浏览器登录页面。"
    Before purchase after login readiness, say once:
    "登录已就绪，直接执行购买流程，可能打开浏览器授权页面。"
    These are notices, not questions; execute immediately without waiting for a reply.
    Successful browser opening stays silent; observe the same running command
    until it returns, without asking for a chat reply or killing/restarting it.
    Failed or explicitly disabled opening returns manualOpenUrl promptly. When
    the completed result also has rerunAllowed=true, resumeMode=same_command,
    and checkoutStarted=false, show the exact link once and pause for the user
    to complete the page. After the user returns, execute the identical command
    with the unchanged context file, without another purchase confirmation.
    Do not immediately loop retries. The CLI resumes the persisted login or
    exact Instruction; possible Checkout creation allows read-only recovery only.
    Automatically continue after readiness and report the terminal result.
    Include returned orderUrl as a clickable 查看订单 / View order link in purchase
    and order-detail replies. Never substitute UCP order IDs or Checkout IDs;
    explain orderUrlUnavailable without inventing a link or retrying payment.
    Portal owns card binding and VIC. The CLI never opens Bind Card.
    At Quick creation, an eligible selected VIC-ready Visa card yields a CREATED
    Quick bound to its paymentInstrumentId, without activation; otherwise the
    new Quick is PENDING. LOGIN and REGISTER both support these outcomes.
    The legacy response field pendingInstructionId carries an ID, not a status.
    Use the actual Instruction status from the response and exact-GET;
    never infer PENDING from the field name. Preserve existing matching Quicks
    as-is; do not relabel a historical PENDING when card readiness changes.
    commerce-login saves the Quick ID and
    returns login-ready for a valid CREATED, PENDING, or ACTIVE Quick, without waiting
    for activation or opening VIC. commerce-run owns card/VIC/Instruction waiting
    and handoffs. Unknown or ongoing VIC state must not trigger another automatic
    VIC opening; the Agent never opens another page.
    Once commerce-login creates a Quick Instruction, commerce-run continues
    that exact ID in every card/VIC state.
    With an existing Quick, exact-GET and validate the original ID against the
    frozen purchase and card. Never switch an existing Quick to any other ACTIVE
    Instruction, even when it matches the same purchase. Missing or mismatched
    Quick state requires a stop, not a new selection.
    With an existing Quick, create zero additional Instructions in every case.
    Card binding, VIC readiness, and Passkey authorization waits inside
    commerce-run are capped at 10 minutes each. Binding failure, a card that
    does not support VIC, and an unfinished Passkey authorization cannot be told
    apart; only the CLI-reported timeout counts as failure, and all of them exit
    through the same recovery below. Preserve the same Quick Instruction ID;
    never create a second Instruction because a wait timed out.
    On that exit, follow the recovery object returned by commerce-run, or run
    visa pending-instructions --instruction-id {ORIGINAL_QUICK_ID}, and act only
    on its status:
    activation_ready: one Instruction and one VIC-ready Visa card are
    determined (a CREATED Quick uses its bound card; a PENDING Quick uses the
    single default VIC-ready Visa, else the only VIC-ready Visa, or the user's
    --payment-instrument-id); the CLI --open opens the exact
    /passkey-auth/{pi}?type=visa&instructionId={ORIGINAL_QUICK_ID} URL directly,
    with no Portal page in between. Only a failed or disabled opening returns
    manualOpenUrl; give that as the manual link. After the user completes
    Passkey, rerun the same visa commerce-run command.
    card_selection_required: several VIC-ready Visa cards qualify and none is
    default; ask the user which card in cards[] to use, then rerun with
    --payment-instrument-id. Never pick by list order.
    portal_binding_required: no VIC-ready Visa card exists, or the bound card is
    missing or unready; give the returned portalUrl
    ({agent portal}/agent-authorization) and name the exact instructionId so
    the user re-binds a card and authorizes it there.
    instruction_not_activatable: the given --instruction-id is not in the
    pending list; tell the user, exact-GET the original ID, and never pick another
    from pendingInstructions[].
    select_in_portal: the context does not identify one Instruction; show the
    returned pendingInstructions[] with the portalUrl and let the user pick and
    activate in that list. Never guess which one.
    none_pending: nothing awaits activation; exact-GET the original Quick
    before any other step.
    Every outcome carries context (exact or unknown) and portalUrl.
    recovery.status: "unavailable" with error means run the command manually.
    Do not provide a VIC URL, a Bind Card link, or the Portal home page as the
    recovery exit; the /agent-authorization list page is the only sanctioned
    Portal recovery link. CWallet activates only the Instruction associated with
    the Passkey ceremony; card readiness alone is not proof of activation.
    Continue only after exact-GET verifies the original Quick ACTIVE and bound
    to the same VIC-ready card. Card readiness alone is not proof of activation.
    With a CREATED Quick, immediately have CLI --open open the exact
    CLI-returned /passkey-auth/{pi}?type=visa&instructionId={ORIGINAL_QUICK_ID}
    URL using the original Quick ID and its bound paymentInstrumentId.
    Do not wait for binding or VIC. Never substitute a different card.
    Validate that the bound card is the same eligible VIC-ready Visa card;
    a missing or mismatched binding requires a stop, not selection by list order.
    Portal's existing /sign activates that same CREATED Quick.
    CREATED is not ACTIVE and does not permit Checkout before authorization.
    With a VIC-ready Visa card and a historical PENDING Quick, CLI --open opens the exact
    /passkey-auth/{pi}?type=visa&instructionId={ORIGINAL_QUICK_ID} URL.
    Use only the CLI-returned URL: {pi} is the selected paymentInstrumentId
    and instructionId is the original Quick ID. Never construct this URL.
    The required backend contract is CWallet compatibility for Portal's existing
    /sign: authorization activates the original Quick ID in this state.
    Never create another Instruction or wait for binding.
    With an existing matching Quick already ACTIVE, reuse that exact ID directly.
    Do not create an Instruction or request another authorization.
    Without a Quick, normal matching ACTIVE reuse and ordinary Instruction
    creation remain unchanged. Do not discard a Quick ID to enter that path.
    The CLI opens the browser, not an Agent browser tool; the Portal home page is
    not an activation link and /agent-authorization is the only Portal
    recovery link. After a successful opening, wait without another
    chat confirmation. On opener failure, return the original Quick's exact
    manual link and exit. A CLI-permitted pre-Checkout rerun resumes the identical
    command and frozen context with the original Quick ID and zero creates.
    If the installed CLI cannot provide this path, report the limitation; never
    fall back to creating or selecting another Instruction.
    After a timeout, follow only explicit CLI pre-Checkout same-command permission
    or read-only recovery, never another Instruction or payment retry. Keep deterministic steps
    inside the CLI, never rerun commerce-run after possible Checkout creation,
    and do not read references or use runtime --help during ordinary execution.
