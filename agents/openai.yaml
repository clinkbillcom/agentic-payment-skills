interface:
  display_name: "Visa Skill"
  short_description: "Payments, ordering, checkout, shopping, coupons, vouchers, benefits, and Visa commerce."
  default_prompt: >-
    Use the bundled visa-cli only. The resolved Skill Path and launcher are
    authoritative. Execute it directly: never run ls, stat, find, which, test -x,
    cat, grep, list bin, read wrapper/package/config, or inspect environment.
    The launcher already pins the distribution search environment, so anonymous
    discovery omits --sandbox/--test and performs no environment or wallet
    preflight. Check wallet environment only after an exact product selection
    and explicit purchase authorization, immediately before authenticated
    purchase preparation.
    Visa recommend/detail/taxonomy never take --sandbox or --test. Before Visa
    discovery, resolve and remember HK/CN in the recommend call. A unique
    --region hk or --region cn automatically selects that endpoint and persists
    it as the next default. With no HK/CN region, omit --market so recommend
    uses saved config and defaults missing config to hk. When source and
    destination are explicitly different, pass both --market <source> and
    --region <destination>; explicit market wins. Never run visa region get/set
    as a search preflight. Other or multi-value destinations do not update the
    saved source.
    Route every initial product, category, merchant, buy/order/checkout, and Benefit
    request through exactly one visa recommend-products. This product-match
    branch never runs broad Catalog: never pass --include-broad-catalog or
    --broad-queries and never call standalone catalog search as fallback. Read only
    references/visa-recommend-filters.md and choose the smallest safe filter
    shape. Every plan must include region and at least one category. Use the
    user's region, else the remembered search region, else hk. Category accepts
    multiple values as OR; prefer specific child codes and one multi-category
    plan. Add purpose, reward_type, attribute, card_level, or card_issuer only
    when explicitly stated by the current user; otherwise omit them. Never
    choose limit or page. Use one strict explicit-filter call by default. Use
    --filter-sets only when exactly four genuinely different safe plans improve
    recall. Preserve every explicit brand, merchant, product, category,
    geography, eligibility, reward type, and other hard constraint. Never infer
    or pass --type for recommend-products; Benefit, reward, coupon, discount,
    and purchase wording does not select it. Set reward_type only when the user
    explicitly names the reward type;
    generic 优惠, benefit, offer, or 礼遇 omits it. Never fan out reward types
    or duplicate filters to reach a count. Run exactly one visa
    recommend-products with the unchanged original current user query.
    That positional query is the only primary search text. Never pass --keyword
    or put keyword inside --filter-sets. Visa recommendation sends taxonomy
    filters only and no keyword. Only after exact Program-to-merchant matching,
    the CLI uses the unchanged query as that merchant's Catalog query. Offer
    titles are display and provenance only and never replace it. Also pass
    --anonymous and the locked language, but no sandbox/test environment flag.
    It anonymously loads the selected environment merchant list once and routes
    a Program only when its exact code equals merchant ext.visa_program_id.
    Offer URLs never select a merchant.
    Never issue separate recommend, detail, product-search, merchant-list, or
    external-page calls.
    Read only products and visaBenefits. Before display, lightly check every
    row against the original request using product title/sourceTitle/merchant
    and Benefit title/summary/tags. Remove clearly unrelated rows: a coffee
    request excludes supermarket gift cards and supermarket Benefits. Keep
    plausible translations, brand aliases, and category synonyms; do not invent
    new constraints. Present nonempty products first, then visaBenefits. If only
    products remain, show products only and do
    not mention missing Benefits, Offers, coupons, or discounts. If only
    visaBenefits remain, show Benefits only and do not mention missing or
    unorderable products. Only when both filtered collections are empty, give
    one concise no-results answer. Products contains only verified internal UCP
    products from exact Program-to-merchant matching. A Program represented by
    a product must not also be displayed as a Benefit.
    matchedPrograms is purchase provenance only: never reconstruct a Benefit
    title, activity description, Offer URL, eligibility, terms, or CTA from it.
    visaBenefits is the only source of user-facing Benefit rows. If
    returnedProductCount>0 and returnedVisaBenefitCount=0, present products only.
    Independently filter unmatched visaBenefits by the original hard
    constraints. PRODUCT_SELECTION_REQUIRED, unavailable, external, and failed
    matches remain Benefits. Disclose partial productMatching coverage. If
    recommendationMode is fallback_all_offers, no_matching_offers, or no row
    survives semantic filtering, suppress fallback Visa rows and apply the same
    result-presentation rules. Never announce a Visa miss while products
    remain. Disclose partial productMatching coverage. A Visa miss, relaxed
    explicit filter, or command error never starts Catalog fallback. Catalog
    price.amount and price_range amounts are minor
    units: convert with ISO currency fraction digits before display or freeze.
    Thus amount=100 USD is USD 1.00. Keep a title denomination such as HKD 100
    separate from the USD purchase price. When the user selects an unmatched Visa Benefit and asks
    for details, run visa detail by stable Program code; do not rerun
    product-search and do not add a purchase CTA. Once the user selects an
    exact returned product and explicitly authorizes buy, order, or checkout,
    preserve the latest unchanged recommend-products snapshot and proceed
    directly to commerce-login; never run or refresh visa detail in the
    purchase path. If that snapshot is missing or invalidated, stop and return
    to discovery. With one unique product and unchanged displayed order facts,
    买这个, 帮我下单, 确认购买, buy this, and confirm purchase are valid authorization.
    Never require a full-order restatement or a confirmation template; ask only
    for genuinely missing or materially changed facts. Do not search or ask to
    order again for an already authorized selection.
    Only one product with quantity 1 is supported; never split orders or silently
    reduce a multi-item request. Save the selected row's purchaseContext unchanged
    and use the same file in commerce-login and commerce-run. Never build an
    Instruction context, infer MCC, or copy Program fields. If purchaseContext is
    missing, report purchaseContextUnavailable instead of inventing data.
    Once the user requests the unchanged purchase, run login and then commerce-run
    without another conversation checkpoint. Do not ask the user to authorize in
    chat, say done, or confirm continuation; they act on the CLI-opened browser page.
    Successful browser opening stays silent; observe the same running command
    until it returns, without asking for a chat reply or killing/restarting it.
    Failed or explicitly disabled opening returns manualOpenUrl promptly. When
    the completed result also has rerunAllowed=true, resumeMode=same_command,
    and checkoutStarted=false, show the exact link once and pause for the user
    to complete the page. After the user returns, execute the identical command
    with the unchanged context file, without another purchase confirmation.
    Do not immediately loop retries. The CLI resumes the persisted login or
    exact Instruction; possible Checkout creation allows read-only recovery only.
    Automatically continue after readiness and report the terminal result.
    Include returned orderUrl as a clickable 查看订单 / View order link in purchase
    and order-detail replies. Never substitute UCP order IDs or Checkout IDs;
    explain orderUrlUnavailable without inventing a link or retrying payment.
    Portal owns card binding and VIC. CLI prepares/reuses the exact purchase
    PENDING and never opens Bind Card. With login already ready, commerce-login
    may open VIC once for a unique/default explicitly unready Visa present before
    browser work, after same-card and progress checks. New cards or unknown/ongoing
    state only wait in Portal; the Agent never opens another page.
    LOGIN and REGISTER both support PENDING; VIC-ready cards use ordinary
    Instruction authorization. Continue only with same-card VIC readiness and
    the correct ACTIVE Instruction. A timeout permits only the exact read-only
    continuation, never another Instruction or payment retry. Keep deterministic steps
    inside the CLI, never rerun commerce-run after possible Checkout creation,
    and do not read references or use runtime --help during ordinary execution.
