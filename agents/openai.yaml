interface:
  display_name: "Visa Skill"
  short_description: "Payments, ordering, checkout, shopping, coupons, vouchers, benefits, and Visa commerce."
  default_prompt: >-
    Use the bundled visa-cli only. Lock one user language and one environment.
    Visa recommend/detail/taxonomy never take --sandbox or --test. Treat Hong
    Kong as --region hk unless the user explicitly says the card is HK-issued.
    For a Visa Benefit request, run one Visa-only visa recommend and never add
    --include-provider-products or call UCP/Catalog during that initial
    recommendation. Independently filter Visa Programs by the original brand,
    category, geography, merchant, product, eligibility, dates, status, and
    channel constraints. If a relevant Program remains, present it without an
    initial Catalog call. If recommendationMode is fallback_all_offers or
    no_matching_offers, or no Program survives semantic filtering, ignore the
    fallback Visa rows and run one all-channel UAT catalog search with the
    original query, language, and geography. Omit --channel-type unless the
    user explicitly restricts it so Eats365 can participate. Broad Catalog is
    bounded and non-exhaustive. When the user selects a Visa Benefit, bind one
    stable Program code, run visa detail, preserve the activity introduction
    and authoritative link, then run visa product-search only with an actual
    merchant commerce URL. Invite ordering only for PRODUCT_VERIFIED plus
    CONTINUE_TO_COMMERCE_LOGIN with productResolution=internal-ucp-catalog and
    exact identity, price, currency, and availability. External-page
    resolution, no match, ambiguity, or incomplete facts must end with activity
    details and the activity link only, without buy/order/checkout language.
    Wait for an explicit purchase reply before commerce-login. Direct shopping
    and Visa-miss Catalog products use commerce-login then commerce-run
    mode=catalog_purchase. For Eats365, manual_item_facts is a normal result:
    freeze channel, store, product, title, price, currency, availability, and
    URL from one broad-Catalog snapshot. Coffee and quick-service food use
    high-confidence MCC 5814, NO_SHIPPING_REQUIRED, and
    digitalDeliveryExpected=false. Ask when MCC or fulfillment confidence is
    low. Never send program.code in purchase or catalog_purchase contexts. If
    no eligible VIC-ready Visa card exists, commerce-login creates or reuses
    one exact no-card PENDING Instruction. It may return a Bind Card link for
    the user, but never opens it automatically and never ends after showing it.
    Keep the same CLI process in the foreground while the user clicks that link
    or binds in an existing Agent Portal. Continue only after the same card has
    visaRegistrationSucceeded=true and CWallet activates that exact
    Instruction. Timeout permits only the exact read-only continuation, never
    a new Instruction or payment retry. Keep all deterministic payment steps
    inside the CLI, never rerun commerce-run after possible Checkout creation,
    and do not read references or use runtime --help during ordinary execution.
