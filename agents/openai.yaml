interface:
  display_name: "Visa Skill"
  short_description: "Payments, ordering, checkout, shopping, coupons, vouchers, benefits, and Visa commerce."
  default_prompt: >-
    Use the bundled visa-cli only. The resolved Skill Path and launcher are
    authoritative. Execute it directly: never run ls, stat, find, which, test -x,
    cat, grep, list bin, read wrapper/package/config, or inspect environment.
    The launcher already pins the distribution search environment, so anonymous
    discovery omits --sandbox/--test and performs no environment or wallet
    preflight. Login, payment-method, Instruction, and Checkout use
    --environment production for this production distribution, even before discovery.
    The five capabilities are independent commands with separate CLI files,
    not a mandatory pipeline. The Agent owns orchestration and semantic
    purchase validation. Login before recommend is valid and login-only needs
    no product, purchase context, or purchase authorization; report readiness
    and stop. A card-readiness-only request needs authentication, not a product,
    and must not start an Instruction or Checkout. Existing exact-ID get/wait
    and fully prepared checkout do not replay earlier commands.
    Independence does not bypass required inputs, current readiness, exact
    IDs, or mutation confirmation. Suggested nextAction does not expand intent.
    purchase-context-validation.ts checks only currency, amount, and MCC,
    never title/description content, equality, or semantic category matching.
    The Agent checks intent, restricted-category meaning, merchant/SKU,
    denomination, region, quantity, titles, and descriptions. Passing numeric
    checks does not prove semantic product equivalence or user authorization.
    Required-argument parsing, PI/VIC, ACTIVE, expiry, usage/reserve, recurring,
    authoritative product IDs/price/availability, and no-retry checks remain
    the responsibility of each CLI command; do not weaken those gates.
    Visa recommend/detail/taxonomy never take --sandbox or --test. Omit --market
    in every search: recommend uses saved config and defaults missing config to
    hk, and a search never switches the HK/CN source. A taxonomy --region is a
    destination, never a source, so --region hk, --region cn, and --region jp
    all leave the saved market unchanged. Run visa region set <hk|cn> only when
    the user explicitly asks to switch markets and visa region get only when the
    user asks which market is active; neither is a search preflight, and asking
    for offers in a place is not asking to switch markets. Pass --market only
    when the user explicitly names the card-issuing market for that one call;
    it overrides that call only and persists nothing.
    Route initial product, category, merchant, buy/order/checkout, and Benefit
    discovery through exactly one visa recommend-products. This product-match
    branch never runs broad Catalog: never pass --include-broad-catalog or
    --broad-queries and never call standalone catalog search as fallback. Keep
    region and Catalog routing in this prompt and choose the smallest safe
    filter shape. Every plan must include region; use the user's region, else the
    remembered search region, else hk. Include at least one category whenever
    the request names a category, merchant, brand, or product, and omit category
    only for a generic regional ask such as 日本有什么优惠 or any offers, which
    returns that region's first page. Never guess a category. When no offer
    satisfies every requested filter the CLI fails with
    reason=no_offer_for_filter_combination in error.details, meaning the axes
    are too narrow together: rerun once with the retryFilters from those details
    and answer from that result, never from the failed call alone. In
    --filter-sets mode an unmatchable set degrades to no-match and is reported
    in strictMatchFailures while the other sets still return. Category
    accepts multiple values as OR; prefer specific child codes and one
    multi-category plan. Add purpose, attribute, card_level, or card_issuer only
    when explicitly stated by the current user; otherwise omit them. Never
    guess non-region taxonomy codes. If another axis or code is needed, run
    visa taxonomy and use the current enum returned by GET {base_url}/api/v1/taxonomy.
    Never fill a taxonomy axis only to make a filter set look complete. Never
    choose limit or page. Use one strict explicit-filter call by default. Use
    --filter-sets only when exactly four genuinely different safe plans improve
    recall. Preserve every explicit brand, merchant, product, category,
    geography, eligibility, reward type, and other hard constraint. Never infer
    or pass --type for recommend-products; Benefit, reward, coupon, discount,
    and purchase wording does not select it. Never fill reward_type in filter
    objects or pass --reward-type, even for coupon or discount requests.
    Keep region, category, and explicitly requested purpose such as local.
    Never duplicate filters to reach a count. Run exactly one visa
    recommend-products with the unchanged original current user query.
    That positional query is the only primary search text. Never pass --keyword
    or put keyword inside --filter-sets. Visa recommendation sends taxonomy
    filters only and no keyword. Only after exact Program-to-merchant matching,
    the CLI uses the unchanged query as that merchant's Catalog query. Offer
    titles are display and provenance only and never replace it. Also pass
    --anonymous and the locked language, but no sandbox/test environment flag.
    It anonymously loads the selected environment merchant list once and routes
    a Program only when its exact code equals merchant ext.visa_program_id.
    Offer URLs never select a merchant.
    Never issue separate recommend, detail, product-search, merchant-list, or
    external-page calls during normal discovery. Normal successful aggregate
    execution does not read reference files. When an aggregate returns an
    error, partial coverage, user-action state, or non-terminal result, read
    only its matching reference:
    references/visa-recommend.md,
    references/visa-recommend-products.md,
    references/visa-product-search.md,
    references/visa-login.md,
    references/visa-payment-method.md,
    references/visa-instruction.md,
    references/visa-checkout.md,
    references/visa-commerce-login.md,
    references/visa-commerce-run.md,
    references/visa-pending-instructions.md, or
    references/visa-browser-open.md.
    Use returned stage, status, reason, error, detail, instructionId,
    paymentInstrumentId, resumeCommand, and recovery to identify the failed
    aggregate step. Use an atomic command only when that reference marks it as
    safe read-only diagnosis or the user explicitly authorizes the mutation.
    Never blindly decompose a failed purchase, create a replacement
    Instruction, retry Checkout, or retry payment. Legacy commerce-login and
    commerce-run commands/exports are compatibility-only, not the main path
    or a fallback for missing new commands. pending-instruction create is
    explicit atomic/test use only, never normal purchase preparation.
    Read only products and visaBenefits. Before display, lightly check every
    row against the original request using product title/sourceTitle/merchant
    and Benefit title/summary/tags. Remove clearly unrelated rows: a coffee
    request excludes supermarket gift cards and supermarket Benefits. Keep
    plausible translations, brand aliases, and category synonyms; do not invent
    new constraints. Present nonempty products first, then visaBenefits. If only
    products remain, show products only and do
    not mention missing Benefits, Offers, coupons, or discounts. If only
    visaBenefits remain, show Benefits only and do not mention missing or
    unorderable products. Only when both filtered collections are empty, give
    one concise no-results answer. Products contains only verified internal UCP
    products from exact Program-to-merchant matching. A Program represented by
    a product must not also be displayed as a Benefit.
    matchedPrograms is purchase provenance only: never reconstruct a Benefit
    title, activity description, Offer URL, eligibility, terms, or CTA from it.
    visaBenefits is the only source of user-facing Benefit rows. If
    returnedProductCount>0 and returnedVisaBenefitCount=0, present products only.
    Independently filter unmatched visaBenefits by the original hard
    constraints. PRODUCT_SELECTION_REQUIRED, unavailable, external, and failed
    matches remain Benefits. Disclose partial productMatching coverage. If
    recommendationMode is fallback_all_offers, no_matching_offers, or no row
    survives semantic filtering, suppress fallback Visa rows and apply the same
    result-presentation rules. Never announce a Visa miss while products
    remain. Disclose partial productMatching coverage. A Visa miss, relaxed
    explicit filter, or command error never starts Catalog fallback. Catalog
    price.amount and price_range amounts are minor
    units: convert with ISO currency fraction digits before display or freeze.
    Thus amount=100 USD is USD 1.00. Keep a title denomination such as HKD 100
    separate from the USD purchase price. For flat commerce arguments, use
    product.totalAmountMajor as --amount; never use product.totalAmountMinor.
    When the user selects an unmatched Visa Benefit and asks
    for details, run visa detail by stable Program code; do not rerun
    product-search and do not add a purchase CTA. Once the user selects an
    exact returned product and explicitly authorizes buy, order, or checkout,
    preserve the latest unchanged recommend-products snapshot and invoke only
    the next needed capability, logging in only if needed; never run or refresh visa detail in the
    purchase path. If that snapshot is missing or invalidated, stop and return
    to discovery. With one unique product and unchanged displayed order facts,
    买这个, 帮我下单, 确认购买, buy this, and confirm purchase are valid authorization.
    Never require a full-order restatement or a confirmation template; ask only
    for genuinely missing or materially changed facts. Do not search or ask to
    order again for an already authorized selection.
    Only one product with quantity 1 is supported; never split orders or silently
    reduce a multi-item request. Keep the selected row's purchaseContext unchanged
    in memory and pass the same frozen facts as flat --xxx arguments to every
    visa instruction candidates/create/get/wait and visa checkout command,
    along with --payment-instrument-id and --selection-source default|explicit.
    --amount uses product.totalAmountMajor, never totalAmountMinor.
    Legacy --context <json> is compatibility-only; do not mix it with flat
    input. Never create a context file. Never build an Instruction context,
    infer MCC, or copy Program fields. If purchaseContext is missing, report
    purchaseContextUnavailable instead of inventing data.
    The numbered steps are a shopping example, not enforced invocation order.
    Step1 is unchanged visa recommend-products: freeze merchant, productId,
    price, currency, and the selected single-item purchase context.
    Step2 is visa login --environment production [--resume <id>], authentication
    only. It receives no purchase/PI arguments or instructionContext and must
    not create Quick/PENDING Instructions or perform card setup. Do not call
    wallet init or substitute visa init. It can run before recommend. A ready
    result ends login-only intent; the Agent chooses any needed next capability
    for a broader authorized request, without implicit command chaining;
    otherwise show manualOpenUrl and use the separate visa browser-open
    --url with that exact URL, then resume the returned login ID.
    Step3 is visa payment-method resolve --environment production. Use the
    persisted default without asking which card. A user may proactively choose
    an alternate by exact ID using --payment-instrument-id <id>
    --selection-source explicit; rechecking a frozen default uses that ID
    and --selection-source default. Never infer a default from first, only,
    newest, or VIC-ready card, or label an Agent choice explicit.
    No card returns bindCardUrl at the Agent Portal root; default selection
    without a persisted default returns manageCardUrl. A ready explicit PI
    does not require a default. A selected supported card not yet VIC-ready
    returns vicUrl. Support false/unknown or a card-info failure stops for
    manual card management, never VIC or Checkout.
    The ENTIRE Step3 is URL-only: never use browser-open, --open, an OS opener,
    preview, or an Agent browser for bindCardUrl, manageCardUrl, or vicUrl.
    Show only the exact URL and stop for user action. When the user returns,
    repeat the same resolve command to recheck state. Create no Instruction
    and do not wait for card/VIC in this step. The explicit alternate must be
    VIC-ready too; setting it default is unnecessary.
    GET /agent/cwallet/card/info is authoritative:
    cardSchemeRegistrationEnabled means support; visaRegistrationSucceeded or
    card-level strongAuthRegistered means completion, never equate them.
    Step3 ready returns paymentInstrumentId and selectionSource default|explicit.
    Freeze BOTH through Steps 4-5. A changed default PI stops a default-based
    purchase and requires reconfirmation; an explicit alternate persists
    despite a default change while owned, usable, and VIC-ready.
    For a purchase needing an authorization choice, the Agent calls visa
    instruction candidates with the same purchase/PI/source. Existing exact-ID
    get/wait skips candidates/create, and neither runs another command.
    It is read-only and filters ACTIVE, PI, currency, amount >= purchase amount,
    MCC, expiry, usage/reserve, and recurring constraints. It returns all
    eligible candidate Instructions plus eligibleMandates containing mandateId,
    title, description, amount/currency/MCC, and the PI.
    The Agent semantically selects the same merchant and SKU, denomination,
    region, and quantity. Equivalent translated titles need not be string-equal.
    Amount alone is not product identity; ambiguous evidence means stop for
    clarification, never guess, choose by list order, or create.
    A match freezes instructionId and mandateId; the Agent may invoke Step5
    within the authorized purchase.
    A verified no-match permits visa instruction create with the same flat
    purchase/PI/source and --confirm-purchase. It creates only an ordinary
    PI-bound CREATED Instruction after PI readiness, never PENDING or bind-pi.
    Retain returned manualOpenUrl, instructionId, and authorizationDeadline
    (epoch milliseconds). Tell the user to use the system browser and avoid
    the actual host's built-in browser. If the host is unknown, say
    "请在系统浏览器中完成操作，不要使用 Agent 内置浏览器。" and never emit {agent}.
    Then call visa browser-open --url with that exact manualOpenUrl.
    Within the five-step flow browser-open is allowed only for Step2 login
    and Step4 activation. Bind Card is URL-only in every flow.
    Next visa instruction get checks immediately, or visa instruction wait
    --authorization-deadline <ms> waits at most 600 seconds (10 minutes).
    Both require --instruction-id <id> and the unchanged purchase/PI/source,
    check exact state first, and never reopen or recreate. Carry the original
    deadline; resuming or reopening never resets it. After manual completion,
    check the state and do not reopen. Require exact ACTIVE and an eligible
    Mandate; CREATED is not authorization. Unknown create/activation results
    or timeout preserve the exact ID for read-only recovery, no replacement.
    Step5 calls visa checkout with the same flat purchase/PI/source,
    --purchase-instruction-id <id> --mandate-id <id> --confirm-purchase.
    It requires a ready PI, exact-GET ACTIVE Instruction and eligible Mandate,
    and revalidation of merchant/product IDs, amount, currency, and availability.
    No implicit login, card selection, Instruction matching/create, or browser.
    --phase checkout_started refuses repeats: use only exact returned read-only
    recovery, never clear phase or rerun after possible Checkout creation.
    instructionId and mandateId are client gate IDs. The UCP complete wire
    still carries PI only; the backend resolver is unchanged. Do not claim
    these chosen IDs are forwarded or consumed exactly at the backend.
    Continue ready capabilities only within the requested scope, without a
    repeated purchase confirmation; stop for
    Step3 user action, changed facts, ambiguity, refusal, timeout, or unknown
    results. Browser launch is not business success or failure. Keep payment
    and delivery evidence separate. Include returned orderUrl as a clickable
    查看订单 / View order link; explain orderUrlUnavailable without constructing
    a link from UCP or Checkout IDs or retrying payment.
