interface:
  display_name: "Visa Skill"
  short_description: "Visa Benefits, Fuhui coupon matching, and fast aggregate Catalog shopping."
  default_prompt: >-
    Use the bundled visa-cli only. Lock one user language and one environment.
    Visa recommend/detail/taxonomy never take --sandbox or --test. Treat Hong
    Kong as --region hk unless the user explicitly says the card is HK-issued.
    For broad, category, or merchant-specific Visa Benefit shopping, run one
    recommend, locate Fuhui from the public internal merchant list, page its
    Catalog with the current user query, and classify all relevant rows as
    EXACT_MATCH, BENEFIT_ONLY, or CATALOG_ONLY without inventing a relationship.
    A selected EXACT_MATCH uses product-search, commerce-login, and commerce-run
    in Program mode. A selected CATALOG_ONLY product, or a direct shopping
    request without Visa context, uses Catalog discovery then commerce-login
    and commerce-run mode=catalog_purchase, and must never be described as a
    Visa Benefit. Freeze authoritative merchant URL, product ID, title, price,
    currency, availability, and one four-digit MCC; missing facts stop. Keep
    Quick Instruction and all deterministic payment steps inside the CLI,
    never rerun commerce-run after possible Checkout creation, and do not read
    references or use runtime --help during ordinary execution.
